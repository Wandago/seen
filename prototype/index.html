<title>Wanlly Seen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700;800;900&family=Figtree:wght@400;500;600;700&family=Anton&family=Permanent+Marker&family=Instrument+Serif:ital@0;1&family=Archivo+Narrow:wght@500;700&family=DM+Serif+Display:ital@0;1&family=Caveat:wght@600&family=UnifrakturMaguntia&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=IBM+Plex+Mono:wght@400;500&family=Bebas+Neue&family=Lora:ital@0;1&family=Patrick+Hand&family=Black+Ops+One&family=Fraunces:ital,wght@1,300&family=Bungee&family=Abril+Fatface&family=VT323&family=Special+Elite&family=Alfa+Slab+One&display=swap">
<style>
/* Layout: warm off-white page broken into full-width pastel bands; centred chunky headlines; big rounded white cards with thick coloured arcs; black pill buttons, one yellow pill for the main sign-up. */
:root {
  --bg: #FFFBF2;     /* warm off-white, like NewComma's page */
  --ink: #0A0A0A;
  --muted: #6D6D6D;
  --line: #E7E7E7;
  --soft: #F6F6F6;
  --card: #FFFFFF;
  --yellow: #FFCB00;
  --on-yellow: #0A0A0A;
  --cream: #FFF2CA;
  --sky: #EEF1FB; --sand: #FFF7E8; --gold: #F8DB9D;
  --mint: #E2FDE2;   --teal: #1E6A5E;
  --lav: #DBCDF0;    --plum: #5B3D8A;
  --peach: #FDE6C8;  --mustard: #D4911C;
  --rose: #FCE5F3;   --maroon: #7A2E22;
  --good: #1F7A4D; --good-soft: #E1F4E9;
  --flag: #AD6200; --flag-soft: #FFEFC9;
  --display: "Gabarito", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Figtree", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
}
/* One light look on purpose, like NewComma. Solid background on html and body so the page is never see-through. */
:root { color-scheme: light }
* { box-sizing: border-box }
html { background: var(--bg) }
body { background: var(--bg); color: var(--ink); font: 15.5px/1.55 var(--body) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.015em; line-height: 1.04 }
h1 { font-size: clamp(2.4rem, 6.4vw, 5rem); font-weight: 900 }
h2 { font-size: clamp(1.9rem, 4vw, 3.1rem); font-weight: 800 }
h3 { font-size: 1.2rem; font-weight: 700; line-height: 1.2 }
p { margin: 0 }
a { color: inherit }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px }
.muted { color: var(--muted) }
.small { font-size: 13.5px }
.eyebrow { font-size: 12.5px; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; color: var(--muted) }
.num { font-variant-numeric: tabular-nums }
.center { text-align: center; justify-items: center }
.lead { font-size: clamp(1rem, 1.6vw, 1.2rem); color: var(--muted); max-width: 54ch }

/* nav */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg) }
.top .wrap { display: flex; align-items: center; gap: 20px; padding-block: 14px; flex-wrap: wrap }
.logo { display: flex; align-items: center; gap: 4px; font-family: var(--display); font-weight: 900; font-size: 1.55rem; letter-spacing: -0.02em; text-transform: uppercase; background: none; border: 0; padding: 0; cursor: pointer }
.logo svg { width: 24px; height: 24px }
.nav { display: flex; gap: 2px; margin-inline: auto; flex-wrap: wrap }
.nav button { background: none; border: 0; padding: 6px 12px; cursor: pointer; font-size: 16px; border-radius: 999px; white-space: nowrap }
.nav button[aria-current="page"] { background: var(--soft); font-weight: 600 }
.auth { display: flex; gap: 10px; align-items: center }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 11px 22px; font-weight: 600; cursor: pointer; border: 1px solid transparent; background: var(--ink); color: var(--bg); font-size: 15.5px; white-space: nowrap }
.btn.sm { padding: 7px 16px; font-size: 14px }
.btn.yellow { background: var(--yellow); color: var(--on-yellow); font-size: 17px; padding: 10px 24px }
.btn.line { background: transparent; color: var(--ink); border-color: var(--line) }
.btn.ghost { background: none; color: var(--muted) }
.btn.teal { background: var(--teal); color: var(--bg) }
.btn.plum { background: var(--plum); color: var(--bg) }
.btn.maroon { background: var(--maroon); color: var(--bg) }
.btn.mustard { background: var(--mustard); color: var(--bg) }
.btn:hover { filter: brightness(1.08) }
.announce { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 14px; color: var(--muted); background: var(--bg) }
.announce b { white-space: nowrap; color: var(--ink); font-weight: 500; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 500; padding: 2px 9px; border-radius: 999px; background: var(--soft); color: var(--muted) }
.pill.good { background: var(--good-soft); color: var(--good) }
.pill.flag { background: var(--flag-soft); color: var(--flag) }
.pill.mint { background: var(--mint); color: var(--teal) }
.pill.lav { background: var(--lav); color: var(--plum) }

/* bands */
main { display: block }
.band { padding-block: clamp(56px, 8vw, 104px) }
/* Bands flow straight into each other with no white gaps: cream → mint → lavender → sky → gold → sand. */
.band.cream { background: linear-gradient(180deg, var(--bg), var(--cream) 55%) }
.band.cream2 { background: linear-gradient(180deg, var(--cream), var(--mint)) }
.band.mint { background: linear-gradient(180deg, var(--mint) 55%, var(--lav)) }
.band.lav { background: linear-gradient(180deg, var(--lav), var(--sky)) }
.band.peach { background: linear-gradient(180deg, var(--sky), var(--gold)) }
.band.sand { background: linear-gradient(180deg, var(--gold), var(--sand) 35%) }
.band.plain { padding-block: 32px 72px }
.stack { display: grid; gap: 16px }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.between { justify-content: space-between }
.t-teal { color: var(--teal) } .t-plum { color: var(--plum) } .t-mustard { color: var(--mustard) } .t-maroon { color: var(--maroon) }

/* hero */
.hero { display: grid; gap: 22px; justify-items: center; text-align: center; padding-block: 40px 0 }
.search { display: grid; grid-template-columns: 1fr 190px auto; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px; width: min(720px, 100%); box-shadow: 0 10px 30px -18px rgb(0 0 0 / .35) }
.search input, .search select { border: 0; background: transparent; padding: 10px 16px; min-width: 0 }
.search select { border-left: 1px solid var(--line) }
.chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center }
.chip { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 14px }
.chip:hover { border-color: var(--ink) }

.frame { position: relative; margin-top: 44px; border: 3px solid var(--mustard); border-radius: 28px; background: var(--card); padding: 20px; box-shadow: 0 30px 60px -40px rgb(0 0 0 / .4) }
.frame .bar { display: flex; align-items: center; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 16px; font-size: 13px }
.petal { position: absolute; width: 150px; height: 150px; right: -40px; bottom: -60px; pointer-events: none }
.faces { display: flex; justify-content: center }
.faces span { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--bg); margin-left: -8px; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 12px; color: var(--on-yellow) }

/* portfolio tiles: CSS stand-ins for photos of work */
.tile { aspect-ratio: 4/3; max-width: 100%; border-radius: 14px; position: relative; overflow: hidden; background: var(--c1, #F2A65A) }
.tile::before { content: ""; position: absolute; width: 85%; aspect-ratio: 1; border-radius: 50%; left: -20%; bottom: -45%; background: var(--c2, #7A2E22) }
.tile::after { content: ""; position: absolute; width: 42%; aspect-ratio: 1; right: 12%; top: 14%; border-radius: 50%; background: var(--c3, #FFCB00) }
.tile[data-s="1"]::after { border-radius: 10px; transform: rotate(14deg) }
.tile[data-s="2"]::before { border-radius: 18px; width: 64%; aspect-ratio: 1.4; left: 18%; bottom: 8% }
.tile[data-s="3"]::after { width: 78%; aspect-ratio: 5; left: 11%; top: 18%; border-radius: 99px }
.tile .who { position: absolute; left: 8px; bottom: 8px; max-width: calc(100% - 16px); z-index: 1; display: flex; gap: 6px; align-items: center; font-size: 11.5px; font-weight: 600; color: #FFFFFF; background: rgb(0 0 0 / .45); border-radius: 999px; padding: 3px 9px 3px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tile .who i { width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF; opacity: .9; flex: none }

.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)) }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; display: grid; cursor: pointer; text-align: left; padding: 10px; gap: 0 }
.card .body { padding: 12px 6px 4px; display: grid; gap: 5px; min-width: 0 }
.card .name { font-family: var(--display); font-weight: 700; font-size: 17px }
.card .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13.5px; color: var(--muted) }
.card:hover { border-color: var(--ink) }
.unclaimed-card .tile { background: repeating-linear-gradient(135deg, var(--soft) 0 10px, var(--card) 10px 20px) }
.unclaimed-card .tile::before, .unclaimed-card .tile::after { display: none }

/* feature cards with thick arcs */
.feature { position: relative; overflow: hidden; background: var(--card); border-radius: 30px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; align-items: center; padding: clamp(24px, 4vw, 48px); border: 1px solid var(--line) }
.feature + .feature { margin-top: 22px }
.feature.flip { grid-template-columns: 1fr 1.1fr }
.feature.flip .copy { order: 2 }
.feature .copy { display: grid; gap: 14px; position: relative; z-index: 1; min-width: 0 }
.feature .copy h2 { font-size: clamp(1.7rem, 3.4vw, 2.6rem) }
.feature .art { position: relative; z-index: 1; min-width: 0 }
.feature::before { content: ""; position: absolute; width: 520px; aspect-ratio: 1; border-radius: 50%; border: 56px solid var(--arc); right: -200px; top: -220px; opacity: .95 }
.feature.flip::before { right: auto; left: -220px; top: auto; bottom: -260px }
.feature.teal { --arc: var(--teal) } .feature.plum { --arc: var(--plum) } .feature.mustard { --arc: var(--mustard) }
.mini { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 10px; box-shadow: 0 20px 40px -30px rgb(0 0 0 / .45) }
.mini .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }

.quote { background: var(--teal); color: var(--bg); border-radius: 30px; padding: clamp(28px, 5vw, 56px); text-align: center; font-family: var(--display); font-size: clamp(1.25rem, 2.4vw, 1.8rem); font-weight: 500; line-height: 1.35; max-width: 980px; margin: 0 auto }
.quote small { display: block; margin-top: 16px; font-family: var(--body); font-size: 15px; opacity: .8 }

/* faq */
.faq { display: grid; gap: 10px; width: min(760px, 100%); margin: 0 auto }
.faq details { border: 1px solid var(--ink); border-radius: 14px; padding: 14px 18px; background: var(--card) }
.faq summary { cursor: pointer; font-weight: 500; font-size: 16.5px; list-style: none; display: flex; gap: 12px }
.faq summary::before { content: "+"; font-weight: 400 }
.faq details[open] summary::before { content: "×" }
.faq details p { margin-top: 8px; color: var(--muted) }

/* footer */
footer { background: #000000; color: #FFFFFF; padding-block: 56px 0 }
footer .cols { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 28px }
footer h4 { margin: 0 0 12px; font-size: 15px }
footer .links { display: grid; gap: 8px; font-size: 14.5px; color: #CFCFCF }
footer .links button { background: none; border: 0; padding: 0; color: inherit; text-align: left; cursor: pointer; font-size: inherit }
.yband { background: var(--yellow); color: var(--on-yellow); border-radius: 26px 26px 0 0; margin-top: 48px; padding: 28px clamp(20px, 4vw, 48px); font-family: var(--display); font-weight: 900; font-size: clamp(2.6rem, 11vw, 9rem); line-height: .9; letter-spacing: -0.03em; text-transform: uppercase; overflow: hidden }

/* inner screens */
.pagehead { display: grid; gap: 12px; padding-block: 24px 28px }
.results { display: grid; grid-template-columns: 230px 1fr; gap: 28px; align-items: start }
.filters { display: grid; gap: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px) }
.filters fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 7px }
.filters legend { margin-bottom: 6px }
.check { display: flex; gap: 8px; align-items: center; font-size: 14.5px }
.toolbar { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); margin-bottom: 18px }
.toolbar input { flex: 1; border: 0; padding: 10px 14px; background: transparent; min-width: 0 }
.toolbar select { border: 0; border-left: 1px solid var(--line); padding: 0 12px; background: transparent }

.pgrid { display: grid; gap: 28px; grid-template-columns: 1fr 320px; align-items: start; margin-top: 28px }
.pgrid > * { min-width: 0 }
.side { display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px) }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: grid; gap: 10px }
.banner { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--cream); border-radius: 22px; padding: 18px 22px }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; font-size: 14.5px; margin: 0 }
.kv dt { color: var(--muted) } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere }

.steps { display: grid; counter-reset: s; max-width: 640px }
.step { display: grid; grid-template-columns: 38px 1fr; gap: 16px; padding-bottom: 26px; position: relative }
.step::before { counter-increment: s; content: counter(s); width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; background: var(--soft); color: var(--muted) }
.step.done::before { content: "✓"; background: var(--teal); color: var(--bg) }
.step.now::before { background: var(--ink); color: var(--bg) }
.step:not(:last-child)::after { content: ""; position: absolute; left: 18px; top: 42px; bottom: 4px; width: 2px; background: var(--line) }
.code { display: flex; gap: 8px; flex-wrap: wrap }
.code input { width: 48px; text-align: center; font-size: 1.3rem; padding: 10px 0; border: 1px solid var(--line); border-radius: 12px; background: var(--card) }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px }
.stat { border-radius: 22px; padding: 16px 18px; display: grid; gap: 2px }
.stat:nth-child(1) { background: var(--cream) } .stat:nth-child(2) { background: var(--mint) } .stat:nth-child(3) { background: var(--lav) } .stat:nth-child(4) { background: var(--peach) }
.stat .v { font-family: var(--display); font-size: 2rem; font-weight: 800 }
.delta { font-size: 13px; font-weight: 600; color: var(--good) }
.spark { width: 100%; height: 130px; display: block }
.todo { display: grid; gap: 8px }
.todo label { display: flex; gap: 10px; align-items: center; font-size: 14.5px }
.meter { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden }
.meter i { display: block; height: 100%; background: var(--yellow) }
.list > div { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--line) }
.list > div:last-child { border-bottom: 0 }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 22px; background: var(--card) }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 14.5px }
th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); white-space: nowrap }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
tr:last-child td { border-bottom: 0 }
.funnel { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px }
.funnel div { border-radius: 18px; padding: 14px 16px; display: grid; gap: 2px; background: var(--soft) }
.funnel b { font-family: var(--display); font-size: 1.6rem; font-weight: 800 }
.email { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px; display: grid; gap: 10px; max-width: 640px; font-size: 15px }
.email .hdr { font-size: 13.5px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 10px; display: grid; gap: 2px }

.scrim { position: fixed; inset: 0; background: rgb(10 10 10 / .5); display: grid; place-items: center; z-index: 20; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.modal { background: var(--card); border-radius: 26px; padding: 26px; width: min(540px, 100%); display: grid; gap: 14px; max-height: 100%; overflow: auto }
.field { display: grid; gap: 6px }
.field label { font-size: 13.5px; font-weight: 600 }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px }
.field textarea { min-height: 90px; resize: vertical }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px) }

/* ───────── Personal sites ─────────
   One markup for every page. Each template sets its own tokens (--s-*), picks a hero layout
   (data-hero: split, poster, center, cover) and a work layout (data-work: grid, bento, masonry, list, wide),
   then adds a few signature touches. */
.site { container-type: inline-size; --s-bg: #FFFFFF; --s-ink: #111111; --s-mut: #6B6B6B; --s-acc: #111111; --s-on: #FFFFFF; --s-acc2: #FFCB00; --s-card: #F4F4F4; --s-line: rgb(0 0 0 / .12); --s-fd: var(--display); --s-fb: var(--body); --s-r: 16px; --s-pr: var(--s-r);
  background: var(--s-bg); color: var(--s-ink); font-family: var(--s-fb); line-height: 1.5; position: relative; overflow: hidden }
.site img { display: block; width: 100%; height: 100%; object-fit: cover }
.s-in { max-width: 1180px; margin: 0 auto; padding-inline: 28px; position: relative }
.s-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }

/* nav */
.s-nav { position: relative; z-index: 3 }
.s-nav .s-in { display: flex; align-items: center; gap: 22px; padding-block: 18px }
.s-logo { font-family: var(--s-fd); font-size: 1.2rem; line-height: 1; white-space: nowrap }
.s-links { display: flex; gap: 22px; margin-left: auto; font-size: 14px; color: var(--s-mut) }
.s-nav .s-btn { padding: 8px 16px; font-size: 13.5px }

/* buttons */
.s-contact { display: flex; flex-wrap: wrap; gap: 8px }
.s-btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 11px 20px; font-weight: 600; font-size: 14.5px; border: 1.5px solid var(--s-ink); background: transparent; color: var(--s-ink); cursor: pointer; white-space: nowrap; font-family: var(--s-fb) }
.s-contact .s-btn:first-child, .s-nav .s-btn { background: var(--s-acc); color: var(--s-on); border-color: var(--s-acc) }
.s-btn b { font-size: 10.5px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: currentColor; flex: none }
.s-btn b span { color: var(--s-bg); font-weight: 700 }
.s-contact .s-btn:first-child b span { color: var(--s-acc) }

/* hero: split is the default */
.s-hero { position: relative; padding-block: 36px 72px }
.s-hero .s-in { display: grid; grid-template-columns: 1.2fr .9fr; gap: 56px; align-items: center }
.s-hero-text { display: grid; gap: 18px; justify-items: start; min-width: 0; position: relative; z-index: 2 }
.s-kicker { font-size: 13px; text-transform: uppercase; letter-spacing: .14em; color: var(--s-mut); font-weight: 600 }
.s-name { font-family: var(--s-fd); font-size: clamp(2.8rem, 8.6cqi, 7rem); line-height: .92; margin: 0; font-weight: 400; letter-spacing: -0.01em; text-wrap: balance; position: relative }
.s-bio { max-width: 46ch; font-size: 1.12rem; color: var(--s-mut) }
.s-portrait { margin: 0; aspect-ratio: 4/5; border-radius: var(--s-pr); overflow: hidden; background: var(--s-card); position: relative; z-index: 1; min-width: 0 }
.s-bigname, .s-tag { display: none }

/* hero: poster, a giant name with the portrait standing in front of it */
.site[data-hero="poster"] .s-hero { padding-top: 12px }
.site[data-hero="poster"] .s-hero .s-in { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 0 }

/* narrow pages: every template collapses the same way */
@container (max-width: 700px) {
  .s-in { padding-inline: 18px }
  .s-links { display: none }
  .s-nav .s-btn { margin-left: auto }
  .s-hero .s-in, .site[data-tpl="pages"] .s-hero .s-in { grid-template-columns: 1fr; gap: 28px }
  .site[data-hero="split"] .s-portrait { order: -1; width: min(100%, 360px) }
  .site[data-hero="cover"] .s-hero .s-in { grid-template-columns: 1fr }
  .site[data-hero="cover"] .s-portrait { display: none }
  .site[data-hero="poster"] .s-bigname { white-space: normal; font-size: var(--bnw); line-height: .9 }
  .site[data-hero="poster"] .s-portrait { grid-area: 2 / 1; width: 70cqi; margin-top: -4cqi }
  .site[data-hero="poster"] .s-hero-text { grid-area: 3 / 1 }
  .site[data-hero="poster"] .s-tag { top: auto; bottom: 40%; }
  .s-stats .s-in { grid-template-columns: 1fr 1fr 1fr }
  .s-stat { padding-right: 8px }
  .s-stat + .s-stat { padding-left: 12px }
  .s-stat span { font-size: 12px }
  .s-grid { grid-template-columns: 1fr 1fr; gap: 12px }
  .site[data-work="bento"] .s-grid { grid-template-columns: 1fr 1fr; grid-auto-rows: 42cqi }
  .site[data-work="bento"] .emb:nth-child(1) { grid-column: 1 / -1; grid-row: span 1 }
  .site[data-work="bento"] .emb:nth-child(4), .site[data-work="bento"] .emb:nth-child(5), .site[data-work="bento"] .emb:nth-child(6) { grid-column: auto }
  .site[data-work="list"] .emb { grid-template-columns: 1fr; gap: 10px }
  .site[data-work="wide"] .s-grid { grid-template-columns: 1fr }
  .s-about .s-in { grid-template-columns: 1fr; gap: 24px }
  .s-about figure { max-width: 360px }
  .s-svc li { grid-template-columns: 40px 1fr auto }
  .emb-cap strong { font-size: 13.5px }
  .site[data-tpl="street"] .s-tag { top: 46%; right: 2% }
  .site[data-tpl="ink"] .s-hero .s-in { padding: 32px 14px; outline-offset: 4px }
}

.cardpic::before, .cardpic::after { display: none }
.cardpic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover }
.cardpic .who i { opacity: 1 }

/* Seen strip above a personal site */
.strip { background: var(--card); border-bottom: 1px solid var(--line) }
.strip .wrap { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-block: 10px; font-size: 14px }
.strip .tpls { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; margin-left: auto; min-width: 0; flex: 1 1 320px; padding-bottom: 2px }
.strip .tpls .swatch, .strip .tpls > span { flex: none }
.tfilters { display: flex; gap: 8px; flex-wrap: wrap }
.tfilters .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.swatch { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 13px }
.swatch i { width: 18px; height: 18px; border-radius: 50%; flex: none; border: 1px solid rgb(0 0 0 / .1) }
.swatch[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg) }

/* Templates gallery */
.tgrid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)) }
.tcard { background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; display: grid; cursor: pointer; text-align: left; padding: 0 }
.tcard:hover { border-color: var(--ink) }
.thumb { height: 300px; overflow: hidden; position: relative; border-bottom: 1px solid var(--line) }
.thumb .site { width: calc(100% / .31); transform: scale(.31); transform-origin: top left; position: absolute; left: 0; top: 0; pointer-events: none }
.tcard .body { padding: 14px 16px 16px; display: grid; gap: 3px }
.tcard .name { font-family: var(--display); font-weight: 700; font-size: 18px }
.soon { display: flex; flex-wrap: wrap; gap: 8px }

/* Editor */
.editor { display: grid; grid-template-columns: 360px 1fr; gap: 22px; align-items: start }
.editor > * { min-width: 0 }
.ed-panel { display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px) }
.ed-links { display: grid; gap: 8px }
.ed-link { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; font-size: 13.5px; background: var(--card) }
.ed-link em { font-style: normal; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: var(--ink); color: var(--bg) }
.ed-link span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
.ed-link button { background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 18px; padding: 0 4px }
.ed-add { display: flex; gap: 6px }
.ed-add input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; background: var(--card) }
.ed-hint { font-size: 12.5px; color: var(--muted) }
.ed-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.ed-row input[type=color] { width: 44px; height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--card) }

function drawQRs(root = document) {
  root.querySelectorAll("[data-qr]").forEach((el) => {

  });
}

        <aside class="side">
          <div class="box share-box"><span class="eyebrow">Share your page</span><div class="share"><div class="qr" data-qr="seen.wanlly.africa/kaz"></div><div class="stack" style="gap:8px;min-width:0"><div class="linkbox"><span>seen.wanlly.africa/kaz</span><button class="btn sm" data-copy="seen.wanlly.africa/kaz">Copy</button></div><span class="small muted">Put the QR code on posters, stickers and business cards.</span></div></div></div>
          <div class="box"><div class="row between"><span class="eyebrow">Your page is 80% complete</span><span class="num">80%</span></div><div class="meter"><i style="width:80%"></i></div>
            <div class="todo"><label><input type="checkbox" checked disabled> 6 links to your work</label><label><input type="checkbox" checked disabled> 4 ways to reach you</label><label><input type="checkbox" checked disabled> Template: Street</label><label><input type="checkbox" disabled> A new link in the last 30 days</label></div>
            <p class="small muted">Pages with new work in the last 30 days are shown first in search.</p></div>

  admin() {
    const rows = [
      ["Mwangi & Co. Catering", "Catering", "Nakuru", "Emailed · step 1 of 3", "flag"],
      ["Pixel Shades Studio", "Photography", "Nairobi", "Claimed Oct 14", "good"],

      ["Lakeside Events", "Events", "Kisumu", "Queued", "lav"],

      <h3 style="margin-top:16px">First email</h3>

const app = document.getElementById("app"), layer = document.getElementById("layer");
function go(v, arg, arg2) {
  app.innerHTML = `<div class="view">${v === "profile" ? views.profile(arg, arg2) : views[v]()}</div>`;
  const navKey = v === "profile" ? "results" : v;
  document.querySelectorAll(".nav button").forEach((b) => b.dataset.go === navKey ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  drawQRs(app);
  window.scrollTo(0, 0);
  try { localStorage.setItem("seen-view", v === "profile" ? "home" : v); } catch {}
}
function renderPreview() {
  const pv = document.getElementById("pv");
  if (!pv) return go("edit");
  pv.innerHTML = site({ ...byId("kaz"), work: ED.work }, ED.tpl, ED.acc);
  drawQRs(pv);
}
function addLink(url) {
  url = url.trim().replace(/^https?:\/\//, "");
  if (!url) return toast("Paste a link first");
  const k = kindOf(url);
  const titles = { ig: "New Instagram post", tt: "New TikTok", yt: "New YouTube video", vi: "New Vimeo video", be: "New Behance project", dr: "New Dribbble shot", sc: "New SoundCloud track", mx: "New Mixcloud mix", pin: "New Pinterest pin", img: "New image", link: "New link" };
  ED.work = [[k, titles[k], url], ...ED.work];
  go("edit");
  toast(`Added from ${KINDS[k].name}`);
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t);
  setTimeout(() => t.remove(), 2600);
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-go],[data-open],[data-toast],[data-copy],[data-close],[data-remove],[data-retpl],[data-edtpl],[data-edrm],[data-edreset],[data-tfilter]");
  if (!el) return;
  if (el.dataset.go) go(el.dataset.go);
  else if (el.dataset.open) el.dataset.open === "unclaimed" ? go("unclaimed") : go("profile", el.dataset.open);
  else if (el.dataset.tfilter) { TFILTER = el.dataset.tfilter; const y = window.scrollY; go("templates"); window.scrollTo(0, y); }
  else if (el.dataset.retpl) { const [id, t] = el.dataset.retpl.split(":"); const y = window.scrollY; go("profile", id, t); window.scrollTo(0, y); }
  else if (el.dataset.edtpl) { ED.tpl = el.dataset.edtpl; ED.acc = ""; const y = window.scrollY; go("edit"); window.scrollTo(0, y); }
  else if (el.dataset.edrm) { ED.work.splice(+el.dataset.edrm, 1); const y = window.scrollY; go("edit"); window.scrollTo(0, y); }
  else if (el.hasAttribute("data-edreset")) { ED.acc = ""; const y = window.scrollY; go("edit"); window.scrollTo(0, y); }
  else if (el.dataset.toast) toast(el.dataset.toast);
  else if (el.dataset.copy) { const t = el.dataset.copy; try { navigator.clipboard.writeText(t).then(() => toast("Link copied"), () => toast(t)); } catch { toast(t); } }
  else if (el.hasAttribute("data-remove")) toast("In the real app: page deleted and email added to the do-not-list");
  else if (el.hasAttribute("data-close")) layer.innerHTML = "";
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.matches(".tcard")) e.target.click();
});
document.addEventListener("input", (e) => {
  if (e.target.id === "edAcc") { ED.acc = e.target.value; renderPreview(); }
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "searchForm") go("results");
  if (e.target.id === "edAdd") addLink(document.getElementById("edUrl").value);
});

// Walkthrough: each step opens a screen and spotlights one part of it.
const TOUR = [
  { part: "Welcome", v: "home", sel: ".hero h1", title: "This is Seen", text: "A free directory at seen.wanlly.africa where Kenyan freelancers and small businesses get their own portfolio site and get found. Seen only connects people. No fees, no commission." },
  { part: "1 · A client looks for talent", v: "home", sel: ".search", title: "Brian needs cover art", text: "He runs a small record label and needs artwork for an EP. He searches for designers in Nairobi.", run: () => { const q = document.getElementById("q"), c = document.getElementById("city"); if (q) q.value = "cover art"; if (c) c.value = "Nairobi"; } },
  { part: "1 · A client looks for talent", v: "results", sel: ".results .grid", title: "He compares people by their work", text: "Every card leads with real work. Pages with new work in the last 30 days come first." },
  { part: "1 · A client looks for talent", v: "profile", arg: "kaz", sel: ".s-hero", title: "Kaz's page is his own site", text: "Kaz picked the Street template: loud, hip hop, his style. A wedding photographer would look completely different." },
  { part: "1 · A client looks for talent", v: "profile", arg: "kaz", sel: ".s-grid", title: "Every piece is a link", text: "Instagram posts, a TikTok, a YouTube video, a Behance project. They show here but stay hosted on those sites. Seen stores no files." },
  { part: "1 · A client looks for talent", v: "profile", arg: "kaz", sel: ".s-contact", title: "Brian reaches Kaz directly", text: "WhatsApp, Instagram DM, email or TikTok, whatever Kaz added. There's no inbox on Seen and no cut. They sort out the job between them." },
  { part: "1 · A client looks for talent", v: "profile", arg: "kaz", tpl: "gallery", sel: ".strip .tpls", title: "Same page, different look", text: "Here's Kaz's page in the Gallery template. Owners can switch any time without losing their links." },
  { part: "2 · Making a page", v: "templates", sel: ".tgrid", title: "A template for every craft", text: "23 so far, growing to 100: Street for designers, Ink for tattoo artists, Matatu for sign writers, Groove for DJs, Fade for barbers, Chalk for tutors, and more." },
  { part: "2 · Making a page", v: "edit", sel: ".ed-work", title: "Add work by pasting a link", text: "Kaz pastes a link to his latest Instagram post. Seen recognises where it's from and shows it on his page.", run: () => { if (!ED.work.some((w) => w[2] === "instagram.com/p/DA2kZ9")) { ED.work = [["ig", "New Instagram post", "instagram.com/p/DA2kZ9"], ...ED.work]; go("edit"); } } },
  { part: "2 · Making a page", v: "edit", sel: ".ed-tpl", title: "Make it his own", text: "One tap changes the template. He can change the accent colour too, and the preview updates as he goes." },
  { part: "2 · Making a page", v: "dash", sel: ".share-box", title: "Share with a link or QR code", text: "Kaz puts seen.wanlly.africa/kaz in his Instagram bio and the QR code on his stickers and posters." },
  { part: "2 · Making a page", v: "dash", sel: ".stats", title: "Proof that it's working", text: "Views, search appearances, contact taps and QR scans. On the 1st of each month he gets the same numbers by email." },
  { part: "3 · Getting businesses on Seen", v: "admin", sel: ".email", title: "You import businesses and invite them", text: "Upload a CSV. Each business gets a basic unclaimed page and a short, honest email: claim it free, or remove it." },
  { part: "3 · Getting businesses on Seen", v: "unclaimed", sel: ".banner", title: "The owner opens their page", text: "Mwangi & Co. Catering sees their basic listing and a big “Claim this page” button. “Remove this page” deletes it for good." },
  { part: "3 · Getting businesses on Seen", v: "claim", sel: ".step.now", title: "Claiming takes 5 minutes", text: "A code goes to the email already on the page. Then they pick a template, link their posts and add their WhatsApp." },
  { part: "That's Seen", v: "home", sel: ".frame", title: "People get seen. Clients find them.", text: "Click around on your own, or restart the walkthrough from the top bar any time." },
];
let tourAt = -1;
function tourShow(i) {
  tourAt = i;
  const s = TOUR[i];
  document.querySelectorAll(".tour-hl").forEach((e) => e.classList.remove("tour-hl"));
  layer.innerHTML = "";
  go(s.v, s.arg, s.tpl);
  if (s.run) s.run();
  document.body.classList.add("tour-on");
  const el = document.querySelector(s.sel);
  if (el) {
    el.classList.add("tour-hl");
    const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
    requestAnimationFrame(() => el.scrollIntoView({ block: "center", behavior: smooth ? "smooth" : "auto" }));
  }
  let card = document.getElementById("tour");
  if (!card) { card = document.createElement("div"); card.id = "tour"; card.className = "tour"; card.setAttribute("role", "dialog"); card.setAttribute("aria-label", "Walkthrough"); document.body.append(card); }
  const last = i === TOUR.length - 1;
  card.innerHTML = `<button class="x" data-tour-end aria-label="Close walkthrough">×</button>
    <span class="part">${esc(s.part)} · ${i + 1} of ${TOUR.length}</span><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p>
    <div class="foot"><span class="dots">${TOUR.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("")}</span>
    ${i ? `<button class="btn ghost sm" data-tour-step="${i - 1}">Back</button>` : ""}
    <button class="btn yellow sm" style="font-size:14px" ${last ? "data-tour-end" : `data-tour-step="${i + 1}"`}>${last ? "Finish" : "Next"}</button></div>`;
  try { localStorage.setItem("seen-tour2", "seen"); } catch {}
}
function tourEnd() {
  tourAt = -1;
  document.getElementById("tour")?.remove();
  document.querySelectorAll(".tour-hl").forEach((e) => e.classList.remove("tour-hl"));
  document.body.classList.remove("tour-on");
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tour],[data-tour-step],[data-tour-end]");
  if (!t) return;
  e.stopImmediatePropagation();
  if (t.hasAttribute("data-tour-end")) tourEnd();
  else if (t.dataset.tourStep) tourShow(+t.dataset.tourStep);
  else tourShow(0);
}, true);
document.addEventListener("keydown", (e) => {
  if (tourAt < 0) return;
  if (e.key === "ArrowRight" && tourAt < TOUR.length - 1) tourShow(tourAt + 1);
  if (e.key === "ArrowLeft" && tourAt > 0) tourShow(tourAt - 1);
  if (e.key === "Escape") tourEnd();
});

let start = "home";
try { start = localStorage.getItem("seen-view") || "home"; } catch {}
go(views[start] ? start : "home");
let toured = null;
try { toured = localStorage.getItem("seen-tour2"); } catch {}
if (!toured) tourShow(0);
window.addEventListener("load", () => drawQRs());
</script>
